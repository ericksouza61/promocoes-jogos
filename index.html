<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoções de Jogos</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #00ffcc; margin-bottom: 20px; font-size: 28px; }
        
        /* Estilos dos Filtros */
        .controls { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-bottom: 30px; background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #2a2a2a; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        .control-group label { font-size: 13px; color: #aaa; font-weight: bold; }
        input, select { padding: 10px 12px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #00ffcc; }
        
        /* Botões de Ação */
        .actions { display: flex; gap: 10px; align-self: flex-end; }
        .btn-search { background: #00ffcc; color: #000; font-weight: bold; border: none; cursor: pointer; padding: 10px 20px; border-radius: 6px; font-size: 14px; transition: background 0.2s; }
        .btn-search:hover { background: #00cca3; }
        .btn-hot { background: #ff4500; color: #fff; font-weight: bold; border: none; cursor: pointer; padding: 10px 20px; border-radius: 6px; font-size: 14px; transition: background 0.2s; }
        .btn-hot:hover { background: #e03d00; }

        /* Estilos da Grelha de Jogos */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        
        /* Estilo do Cartão */
        .card { 
            background: #1e1e1e; 
            border-radius: 8px; 
            padding: 16px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            border: 1px solid #262626;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover { transform: translateY(-3px); border-color: #00ffcc; }
        
        .card-top { display: flex; flex-direction: column; gap: 8px; }
        .card img { width: 100%; height: 130px; object-fit: cover; border-radius: 6px; background-color: #2a2a2a; }
        
        .title { 
            font-size: 15px; 
            font-weight: bold; 
            color: #fff; 
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 38px;
        }
        
        .store-tag { font-size: 12px; color: #888; font-style: italic; }

        /* Preços e Botões */
        .card-bottom { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
        .price-container { display: flex; flex-direction: column; gap: 2px; }
        .normal-price { text-decoration: line-through; color: #777; font-size: 13px; }
        .price-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .price { color: #00ffcc; font-size: 19px; font-weight: bold; }
        
        .badge-discount { 
            background: rgba(0, 255, 204, 0.15); 
            color: #00ffcc; 
            font-size: 12px; 
            font-weight: bold; 
            padding: 3px 8px; 
            border-radius: 4px; 
            border: 1px solid rgba(0, 255, 204, 0.3);
        }

        .btn { 
            display: block; 
            text-align: center; 
            background: #00ffcc; 
            color: #000; 
            padding: 10px; 
            border-radius: 6px; 
            text-decoration: none; 
            font-weight: bold; 
            margin-top: 6px; 
            transition: background 0.2s;
            font-size: 14px;
        }
        .btn:hover { background: #00cca3; }
        .loading { text-align: center; font-size: 18px; color: #aaa; grid-column: 1 / -1; padding: 40px 0; }
    </style>
</head>
<body>

    <h1>🔥 Promoções de Jogos</h1>

    <!-- Barra de Pesquisa e Filtros -->
    <div class="controls">
        <div class="control-group" style="flex-grow: 1; max-width: 220px;">
            <label for="searchTitle">Buscar por nome:</label>
            <input type="text" id="searchTitle" placeholder="Ex: Batman, Resident Evil...">
        </div>
        
        <div class="control-group">
            <label for="minPrice">Preço mín. (R$):</label>
            <input type="number" id="minPrice" value="0" min="0" max="500" style="width: 95px;">
        </div>

        <div class="control-group">
            <label for="maxPrice">Preço máx. (R$):</label>
            <input type="number" id="maxPrice" value="200" min="5" max="1000" style="width: 95px;">
        </div>

        <div class="control-group">
            <label for="storeSelect">Loja:</label>
            <select id="storeSelect">
                <option value="">Todas as Lojas</option>
                <option value="1">Steam</option>
                <option value="7">GOG</option>
                <option value="25">Epic Games Store</option>
                <option value="11">Humble Store</option>
                <option value="2">GamersGate</option>
                <option value="3">Green Man Gaming</option>
                <option value="15">Fanatical</option>
            </select>
        </div>

        <div class="control-group">
            <label for="sortBy">Ordenar por:</label>
            <select id="sortBy">
                <option value="SavingsDesc">Maior Desconto (%)</option>
                <option value="SavingsAsc">Menor Desconto (%)</option>
                <option value="PriceAsc">Menor Preço (Crescente)</option>
                <option value="PriceDesc">Maior Preço (Decrescente)</option>
                <option value="Title">Nome do Jogo</option>
            </select>
        </div>

        <div class="actions">
            <button class="btn-search" onclick="resetAndFetch()">Filtrar</button>
            <button class="btn-hot" onclick="filterHotDeals()" title="Mostrar apenas super promoções">🔥 Em Alta</button>
        </div>
    </div>

    <!-- Lista de Jogos -->
    <div id="deals" class="grid">
        <div class="loading">Carregando cotação do Dólar e promoções...</div>
    </div>
    
    <div id="loadMoreStatus" style="text-align: center; color: #777; padding: 20px; display: none;">Carregando mais jogos...</div>

    <script>
        let usdRate = 5.0; 
        let currentPage = 0;
        let isLoading = false;
        let hasMoreData = true;

        const storeNames = {
            "1": "Steam",
            "2": "GamersGate",
            "3": "GreenManGaming",
            "7": "GOG",
            "11": "Humble Store",
            "15": "Fanatical",
            "25": "Epic Games"
        };

        async function getUSDRate() {
            try {
                const response = await fetch('https://economia.awesomeapi.com.br/last/USD-BRL');
                const data = await response.json();
                if (data.USDBRL && data.USDBRL.bid) {
                    usdRate = parseFloat(data.USDBRL.bid);
                }
            } catch (e) {
                console.warn('Usando taxa estimada.');
            }
        }

        function resetAndFetch() {
            currentPage = 0;
            hasMoreData = true;
            document.getElementById('deals').innerHTML = '<div class="loading">Buscando ofertas...</div>';
            fetchDeals(false);
        }

        function filterHotDeals() {
            document.getElementById('searchTitle').value = '';
            document.getElementById('minPrice').value = 0;
            document.getElementById('maxPrice').value = 300;
            document.getElementById('storeSelect').value = '';
            document.getElementById('sortBy').value = 'SavingsDesc';
            resetAndFetch();
        }

        async function fetchDeals(isAppending = false) {
            if (isLoading || !hasMoreData) return;
            isLoading = true;

            const container = document.getElementById('deals');
            const statusIndicator = document.getElementById('loadMoreStatus');

            if (!isAppending) {
                container.innerHTML = '<div class="loading">Buscando ofertas...</div>';
            } else {
                statusIndicator.style.display = 'block';
            }

            const title = document.getElementById('searchTitle').value;
            const minPriceBRL = parseFloat(document.getElementById('minPrice').value) || 0;
            const maxPriceBRL = parseFloat(document.getElementById('maxPrice').value) || 200;
            const storeID = document.getElementById('storeSelect').value;
            const sortOption = document.getElementById('sortBy').value;

            // Mapeamento dos parâmetros de ordenação na API CheapShark
            let sortByParam = 'Savings';
            let descParam = 0;

            if (sortOption === 'SavingsDesc') {
                sortByParam = 'Savings';
                descParam = 0; // Maior desconto primeiro
            } else if (sortOption === 'SavingsAsc') {
                sortByParam = 'Savings';
                descParam = 1; // Menor desconto primeiro (crescente)
            } else if (sortOption === 'PriceAsc') {
                sortByParam = 'Price';
                descParam = 0; // Preço crescente
            } else if (sortOption === 'PriceDesc') {
                sortByParam = 'Price';
                descParam = 1; // Preço decrescente
            } else if (sortOption === 'Title') {
                sortByParam = 'Title';
                descParam = 0;
            }

            const minPriceUSD = (minPriceBRL / usdRate).toFixed(2);
            const maxPriceUSD = (maxPriceBRL / usdRate).toFixed(2);

            let url = `https://www.cheapshark.com/api/1.0/deals?lowerPrice=${minPriceUSD}&upperPrice=${maxPriceUSD}&sortBy=${sortByParam}&desc=${descParam}&pageNumber=${currentPage}&pageSize=20`;
            
            if (storeID !== "") {
                url += `&storeID=${storeID}`;
            }

            if (title.trim() !== '') {
                url += `&title=${encodeURIComponent(title)}`;
            }

            try {
                const response = await fetch(url);
                const deals = await response.json();
                
                if (!isAppending) {
                    container.innerHTML = '';
                }

                if (deals.length === 0) {
                    hasMoreData = false;
                    if (!isAppending) {
                        container.innerHTML = '<div class="loading">Nenhuma promoção encontrada com esses filtros.</div>';
                    }
                    statusIndicator.style.display = 'none';
                    isLoading = false;
                    return;
                }

                if (deals.length < 20) {
                    hasMoreData = false;
                }

                deals.forEach(deal => {
                    const normalPriceBRL = (parseFloat(deal.normalPrice) * usdRate).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    const salePriceBRL = (parseFloat(deal.salePrice) * usdRate).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    const storeName = storeNames[deal.storeID] || 'Loja Parceira';
                    const savingsPercent = Math.round(deal.savings);

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-top">
                            <img src="${deal.thumb}" alt="${deal.title}">
                            <div class="title" title="${deal.title}">${deal.title}</div>
                            <div class="store-tag">🎮 Loja: ${storeName}</div>
                        </div>
                        <div class="card-bottom">
                            <div class="price-container">
                                <div class="normal-price">${normalPriceBRL}</div>
                                <div class="price-row">
                                    <div class="price">${salePriceBRL}</div>
                                    <div class="badge-discount">-${savingsPercent}%</div>
                                </div>
                            </div>
                            <a class="btn" href="https://www.cheapshark.com/redirect?dealID=${deal.dealID}" target="_blank">Ver Oferta</a>
                        </div>
                    `;
                    container.appendChild(card);
                });

                currentPage++;
            } catch (error) {
                if (!isAppending) {
                    container.innerHTML = '<div class="loading">Erro ao carregar as promoções. Tente novamente.</div>';
                }
            } finally {
                isLoading = false;
                statusIndicator.style.display = 'none';
            }
        }

        // Listener para rolagem infinita
        window.addEventListener('scroll', () => {
            const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
            if (scrollTop + clientHeight >= scrollHeight - 300) {
                fetchDeals(true);
            }
        });

        document.getElementById('searchTitle').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                resetAndFetch();
            }
        });

        async function init() {
            await getUSDRate();
            fetchDeals(false);
        }

        init();
    </script>

</body>
</html>
