<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoções de Jogos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #00ffcc; margin-bottom: 20px; }
        
        /* Estilos dos Filtros */
        .controls { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-bottom: 30px; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group label { font-size: 14px; color: #aaa; }
        input, select { padding: 10px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #00ffcc; }
        .btn-search { background: #00ffcc; color: #000; font-weight: bold; border: none; cursor: pointer; padding: 10px 20px; border-radius: 4px; align-self: flex-end; }
        .btn-search:hover { background: #00cca3; }

        /* Estilos da Grelha de Jogos */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #1e1e1e; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
        .title { font-size: 16px; font-weight: bold; margin: 10px 0; color: #fff; }
        .price { color: #00ffcc; font-size: 18px; font-weight: bold; }
        .normal-price { text-decoration: line-through; color: #888; font-size: 14px; }
        .store-tag { font-size: 12px; color: #aaa; margin-top: 4px; font-style: italic; }
        .btn { display: block; text-align: center; background: #00ffcc; color: #000; padding: 10px; border-radius: 4px; text-decoration: none; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #00cca3; }
        .loading { text-align: center; font-size: 18px; color: #aaa; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <h1>🔥 Promoções de Jogos</h1>

    <!-- Barra de Pesquisa e Filtros -->
    <div class="controls">
        <div class="control-group" style="flex-grow: 1; max-width: 250px;">
            <label for="searchTitle">Buscar por nome:</label>
            <input type="text" id="searchTitle" placeholder="Ex: Batman, Resident Evil...">
        </div>
        
        <div class="control-group">
            <label for="maxPrice">Preço máximo (R$):</label>
            <input type="number" id="maxPrice" value="100" min="5" max="500" style="width: 110px;">
        </div>

        <div class="control-group">
            <label for="storeSelect">Loja:</label>
            <select id="storeSelect">
                <option value="">Todas as Lojas</option>
                <option value="1">Steam</option>
                <option value="7">GOG</option>
                <option value="25">Epic Games Store</option>
                <option value="11">Humble Store</option>
                <option value="2">GamersGate</option>
                <option value="3">Green Man Gaming</option>
                <option value="15">Fanatical</option>
            </select>
        </div>

        <div class="control-group">
            <label for="sortBy">Ordenar por:</label>
            <select id="sortBy">
                <option value="Savings">Maior Desconto (%)</option>
                <option value="Price">Menor Preço</option>
                <option value="Title">Nome do Jogo</option>
            </select>
        </div>

        <button class="btn-search" onclick="fetchDeals()">Filtrar</button>
    </div>

    <!-- Lista de Jogos -->
    <div id="deals" class="grid">
        <div class="loading">Carregando cotação do Dólar e promoções...</div>
    </div>

    <script>
        let usdRate = 5.0; // Valor padrão de contingência

        // Mapeamento manual dos nomes das principais lojas
        const storeNames = {
            "1": "Steam",
            "2": "GamersGate",
            "3": "GreenManGaming",
            "7": "GOG",
            "11": "Humble Store",
            "15": "Fanatical",
            "25": "Epic Games"
        };

        // Buscar cotação atual do Dólar em BRL
        async function getUSDRate() {
            try {
                const response = await fetch('https://economia.awesomeapi.com.br/last/USD-BRL');
                const data = await response.json();
                if (data.USDBRL && data.USDBRL.bid) {
                    usdRate = parseFloat(data.USDBRL.bid);
                }
            } catch (e) {
                console.warn('Não foi possível obter a cotação em tempo real. Usando taxa estimada.');
            }
        }

        async function fetchDeals() {
            const container = document.getElementById('deals');
            container.innerHTML = '<div class="loading">Buscando ofertas...</div>';

            const title = document.getElementById('searchTitle').value;
            const maxPriceBRL = parseFloat(document.getElementById('maxPrice').value) || 100;
            const storeID = document.getElementById('storeSelect').value;
            const sortBy = document.getElementById('sortBy').value;

            // Converter o valor em Reais para Dólares para a requisição da API
            const maxPriceUSD = (maxPriceBRL / usdRate).toFixed(2);

            let url = `https://www.cheapshark.com/api/1.0/deals?upperPrice=${maxPriceUSD}&sortBy=${sortBy}&pageSize=24`;
            
            if (storeID !== "") {
                url += `&storeID=${storeID}`;
            }

            if (title.trim() !== '') {
                url += `&title=${encodeURIComponent(title)}`;
            }

            try {
                const response = await fetch(url);
                const deals = await response.json();
                
                container.innerHTML = '';

                if (deals.length === 0) {
                    container.innerHTML = '<div class="loading">Nenhuma promoção encontrada com esses filtros.</div>';
                    return;
                }

                deals.forEach(deal => {
                    // Conversão de preços para R$
                    const normalPriceBRL = (parseFloat(deal.normalPrice) * usdRate).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    const salePriceBRL = (parseFloat(deal.salePrice) * usdRate).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    const storeName = storeNames[deal.storeID] || 'Loja Parceira';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <img src="${deal.thumb}" alt="${deal.title}">
                            <div class="title">${deal.title}</div>
                            <div class="store-tag">🎮 Loja: ${storeName}</div>
                        </div>
                        <div style="margin-top: 10px;">
                            <div class="normal-price">${normalPriceBRL}</div>
                            <div class="price">${salePriceBRL} <span style="font-size:12px; color:#00ffcc;">(-${Math.round(deal.savings)}%)</span></div>
                            <a class="btn" href="https://www.cheapshark.com/redirect?dealID=${deal.dealID}" target="_blank">Ver Oferta</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = '<div class="loading">Erro ao carregar as promoções. Tente novamente.</div>';
            }
        }

        // Permitir buscar ao pressionar Enter no campo de busca
        document.getElementById('searchTitle').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                fetchDeals();
            }
        });

        // Inicialização
        async function init() {
            await getUSDRate();
            fetchDeals();
        }

        init();
    </script>

</body>
</html>
