<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoções de Jogos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #00ffcc; margin-bottom: 20px; }
        
        /* Estilos dos Filtros */
        .controls { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-bottom: 30px; background: #1e1e1e; padding: 15px; border-radius: 8px; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group label { font-size: 14px; color: #aaa; }
        input, select { padding: 10px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #00ffcc; }
        .btn-search { background: #00ffcc; color: #000; font-weight: bold; border: none; cursor: pointer; padding: 10px 20px; border-radius: 4px; align-self: flex-end; }
        .btn-search:hover { background: #00cca3; }

        /* Estilos da Grelha de Jogos */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #1e1e1e; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
        .title { font-size: 16px; font-weight: bold; margin: 10px 0; color: #fff; }
        .price { color: #00ffcc; font-size: 18px; font-weight: bold; }
        .normal-price { text-decoration: line-through; color: #888; font-size: 14px; }
        .btn { display: block; text-align: center; background: #00ffcc; color: #000; padding: 10px; border-radius: 4px; text-decoration: none; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #00cca3; }
        .loading { text-align: center; font-size: 18px; color: #aaa; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <h1>🔥 Promoções de Jogos</h1>

    <!-- Barra de Pesquisa e Filtros -->
    <div class="controls">
        <div class="control-group" style="flex-grow: 1; max-width: 300px;">
            <label for="searchTitle">Buscar por nome:</label>
            <input type="text" id="searchTitle" placeholder="Ex: Batman, Resident Evil...">
        </div>
        <div class="control-group">
            <label for="maxPrice">Preço máximo ($):</label>
            <input type="number" id="maxPrice" value="20" min="1" max="100" style="width: 100px;">
        </div>
        <button class="btn-search" onclick="fetchDeals()">Filtrar</button>
    </div>

    <!-- Lista de Jogos -->
    <div id="deals" class="grid">
        <div class="loading">Carregando promoções...</div>
    </div>

    <script>
        async function fetchDeals() {
            const container = document.getElementById('deals');
            container.innerHTML = '<div class="loading">Buscando ofertas...</div>';

            const title = document.getElementById('searchTitle').value;
            const maxPrice = document.getElementById('maxPrice').value || 50;

            // Construção da URL da API dinâmica com base nos filtros
            let url = `https://www.cheapshark.com/api/1.0/deals?upperPrice=${maxPrice}&pageSize=24`;
            if (title.trim() !== '') {
                url += `&title=${encodeURIComponent(title)}`;
            }

            try {
                const response = await fetch(url);
                const deals = await response.json();
                
                container.innerHTML = '';

                if (deals.length === 0) {
                    container.innerHTML = '<div class="loading">Nenhuma promoção encontrada com esses filtros.</div>';
                    return;
                }

                deals.forEach(deal => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <img src="${deal.thumb}" alt="${deal.title}">
                            <div class="title">${deal.title}</div>
                        </div>
                        <div>
                            <div class="normal-price">$${deal.normalPrice}</div>
                            <div class="price">$${deal.salePrice} <span style="font-size:12px; color:#00ffcc;">(-${Math.round(deal.savings)}%)</span></div>
                            <a class="btn" href="https://www.cheapshark.com/redirect?dealID=${deal.dealID}" target="_blank">Ver Oferta</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = '<div class="loading">Erro ao carregar as promoções. Tente novamente.</div>';
            }
        }

        // Permitir buscar ao pressionar Enter no campo de busca
        document.getElementById('searchTitle').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                fetchDeals();
            }
        });

        // Carregar ofertas iniciais
        fetchDeals();
    </script>

</body>
</html>
